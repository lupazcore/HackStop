services:
  db:
    image: postgres:16
    pull_policy: missing
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hackstop}
      POSTGRES_USER: ${POSTGRES_USER:-hackstop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackstop-local-db-password}
      PGPORT: ${DB_PORT:-5432}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -p "$$PGPORT"']
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [portal]
  app:
    image: hackstop:local
    pull_policy: build
    build: .
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:${APP_PORT:-8080}'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hackstop}:${POSTGRES_PASSWORD:-hackstop-local-db-password}@db:${DB_PORT:-5432}/${POSTGRES_DB:-hackstop}
      PORT: ${APP_PORT:-8080}
      HOSTNAME: 0.0.0.0
      APP_URL: ${APP_URL:-http://localhost:8080}
      SEED_PASSWORD: ${SEED_PASSWORD:-hackstop-local-seed-password}
      SEED_SESSION_SECRET: ${SEED_SESSION_SECRET:-hackstop-local-session-seed-not-secret-2026}
      SEED_ORGANIZER_EMAIL: ${SEED_ORGANIZER_EMAIL:-organizer@example.org}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.org}
      FIXTURES_PATH: ${FIXTURES_PATH:-docs/fixtures.json}
      VOTE_RATE_LIMIT_PER_HOUR: ${VOTE_RATE_LIMIT_PER_HOUR:-20}
      COMMENT_RATE_LIMIT_PER_HOUR: ${COMMENT_RATE_LIMIT_PER_HOUR:-10}
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      db:
        condition: service_healthy
    networks: [portal]
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://" + process.env.HOSTNAME + ":" + process.env.PORT + "/api/health").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
volumes:
  postgres-data:
networks:
  portal:
    driver: bridge
