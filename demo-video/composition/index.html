<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fafafa; }
      #root { width: 100%; height: 100%; font-family: Inter, Arial, sans-serif; color: #0a0a0a; }
      .clip { position: absolute; inset: 0; width: 100%; height: 100%; }
      .scene-content { width: 100%; height: 100%; padding: 80px 120px; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
      .intro, .outro { align-items: center; text-align: center; }
      .eyebrow { color: #2563eb; font-size: 26px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 112px; letter-spacing: -.06em; }
      h2 { margin: 0; font-size: 54px; letter-spacing: -.04em; }
      p { margin: 0; color: #525252; font-size: 30px; }
      .shot { width: 1600px; height: 900px; object-fit: contain; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 20px 60px rgba(10,10,10,.08); }
      .screen-scene .scene-content { align-items: center; padding: 45px 120px; gap: 26px; }
      .caption { display: flex; justify-content: space-between; align-items: center; width: 1600px; }
      .brand { font-weight: 700; color: #2563eb; font-size: 28px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1920" data-height="1080">
      <section id="intro" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div class="scene-content intro">
          <div class="eyebrow">Self-hosted hackathon portal</div>
          <h1>HackStop</h1>
          <p>Run your hackathon in one place.</p>
        </div>
      </section>
      <section id="gallery" class="clip screen-scene" data-start="4" data-duration="5" data-track-index="0">
        <div class="scene-content">
          <div class="caption"><h2>Discover every submission</h2><span class="brand">HackStop</span></div>
          <img class="shot" src="assets/gallery.png" alt="Public project gallery" />
        </div>
      </section>
      <section id="organizer" class="clip screen-scene" data-start="9" data-duration="5" data-track-index="0">
        <div class="scene-content">
          <div class="caption"><h2>Coordinate judges and rubrics</h2><span class="brand">HackStop</span></div>
          <img class="shot" src="assets/organizer.png" alt="Organizer judging dashboard" />
        </div>
      </section>
      <section id="judge" class="clip screen-scene" data-start="14" data-duration="5" data-track-index="0">
        <div class="scene-content">
          <div class="caption"><h2>Review assigned projects</h2><span class="brand">HackStop</span></div>
          <img class="shot" src="assets/judge.png" alt="Judge review dashboard" />
        </div>
      </section>
      <section id="outro" class="clip" data-start="19" data-duration="5" data-track-index="0">
        <div class="scene-content outro">
          <div class="eyebrow">HackStop</div>
          <h1>Submit. Judge. Export.</h1>
          <p>From first project to final ranking.</p>
        </div>
      </section>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      for (const [id, start, duration] of [
        ['intro', 0, 4], ['gallery', 4, 5], ['organizer', 9, 5], ['judge', 14, 5], ['outro', 19, 5]
      ]) {
        tl.fromTo(`#${id} .scene-content`, { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: .6, ease: 'power2.out' }, start + .1);
        tl.to(`#${id} .scene-content`, { opacity: 0, y: -24, duration: .35, ease: 'power2.in' }, start + duration - .4);
      }
      window.__timelines = window.__timelines || {};
      window.__timelines.main = tl;
      tl.seek(0);
    </script>
  </body>
</html>
